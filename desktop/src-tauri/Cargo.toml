[package]
name = "filenexus-desktop"
version = "0.1.0"
description = "FileNexus desktop client"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-updater = "=2.13.3"
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-notification = "=2.6.0"
tauri-plugin-single-instance = "=2.5.3"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-process = "=2.4.0"
tauri-plugin-store = "=2.5.0"
serde_json = "=1.0.154"
log = "=0.4.34"

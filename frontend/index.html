<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileNexus - File Management Hub</title>
    <meta
      name="description"
      content="Secure, high-speed file management system with end-to-end encryption and R2 acceleration."
    />

    <!--
      Open Graph (Facebook, LINE, Discord). og:image is relative here; when
      VITE_SITE_URL is set at build time, vite.config.ts rewrites it to an
      absolute URL and adds og:url. The backend /share/<token> handler
      replaces title/description/image/type per file via regex, so keep each
      of those as a single tag.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FileNexus" />
    <meta property="og:title" content="FileNexus - File Management Hub" />
    <meta
      property="og:description"
      content="Securely store and share your files with FileNexus. Features R2 acceleration and military-grade encryption."
    />
    <meta property="og:image" content="/og-card.jpg" />

    <!-- Twitter/X card: title, description and image fall back to og:* -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Mobile Theme Color -->
    <meta name="theme-color" content="#020205" />

    <!-- Apply a stored effects level (e.g. plain 極簡) before the first paint; see src/lib/effects.ts -->
    <script>
      try {
        var storedEffects = localStorage.getItem('filenexus-effects');
        if (/^(full|low|plain)$/.test(storedEffects)) document.documentElement.dataset.effects = storedEffects;
      } catch (error) {
        console.error('Could not read the stored effects level', error);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

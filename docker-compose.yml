# Backend-only stack. Frontend: deploy ./frontend to Cloudflare Pages.
# Usage:  cp ".env example" .env  &&  docker compose up -d --build
# Add the Cloudflare Tunnel with:  docker compose --profile tunnel up -d
services:
  backend:
    build: .
    container_name: filenexus-backend
    restart: unless-stopped
    env_file: .env
    # Run as the host user so ./data stays writable (export PUID/PGID or edit .env).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      SERVER__DEBUG: "false"
      BACKUP__DIR: /app/backups
    ports:
      - "127.0.0.1:5168:5168"
    volumes:
      # Host directory holding users.db / files.db / notes.db / uploads/ etc.
      # Set DATA_DIR in .env to use an existing data directory on another disk.
      - ${DATA_DIR:-./data}:/app/data
      # Scheduled database backups; set BACKUP_DIR to a directory on another disk.
      - ${BACKUP_DIR:-./backups}:/app/backups

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: filenexus-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - backend
